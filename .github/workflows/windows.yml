# Builds the Aster Windows installer in GitHub's cloud.
# - Run manually (Actions tab, Run workflow): you get the installer as a download, nothing is published.
# - Push a tag like v5.4.0: it builds, publishes a GitHub Release, and installed copies of Aster update themselves.
name: Build Windows installer
on:
  workflow_dispatch: {}
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Use the tag as the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Build and publish (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node prepare.mjs
          npx electron-builder --win nsis --x64 --publish always \
            -c.publish.provider=github -c.publish.owner="${GITHUB_REPOSITORY_OWNER}" -c.publish.repo="${GITHUB_REPOSITORY#*/}"
      - name: Build only (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Aster-windows
          path: |
            desktop/release/*Setup*.exe
            desktop/release/*.exe
