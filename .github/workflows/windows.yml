# Builds the Aster Windows installer in GitHub's cloud.
# Every time you push to GitHub (GitHub Desktop: Commit, then Push origin) this builds the installer, publishes it as a
# GitHub Release, and installed copies of Aster update themselves. Run it by hand to get a build without publishing.
name: Build Windows installer
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['src/**', 'desktop/**', 'tools/**', 'public/**', 'index.html', 'package.json', 'vite.config.ts']
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Number this build (5.4.<run number>) so every push counts as a newer version
        if: github.event_name == 'push'
        run: npm version "5.4.${GITHUB_RUN_NUMBER}" --no-git-tag-version --allow-same-version
      - name: Build and publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node prepare.mjs
          npx electron-builder --win nsis --x64 --publish always \
            -c.publish.provider=github -c.publish.releaseType=release -c.publish.owner="${GITHUB_REPOSITORY_OWNER}" -c.publish.repo="${GITHUB_REPOSITORY#*/}"
      - name: Build only (manual run)
        if: github.event_name != 'push'
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Aster-windows
          path: |
            desktop/release/*Setup*.exe
            desktop/release/*.exe
