# Builds the Aster phone app (an .apk you can install) in GitHub's cloud, so you need nothing installed.
# Use: put this project on GitHub, open the Actions tab, pick "Build Android app", press Run workflow, then download the APK.
name: Build Android app
on:
  workflow_dispatch: {}
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Allow plain http to your computer on the home Wi-Fi
        run: sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
      - name: Use the Aster icon
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              [ -f "android/app/src/main/res/mipmap-$d/$f.png" ] && cp ../public/icon-192.png "android/app/src/main/res/mipmap-$d/$f.png" || true
            done
          done
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android/android
      - uses: actions/upload-artifact@v4
        with:
          name: Aster-apk
          path: android/android/app/build/outputs/apk/debug/app-debug.apk
